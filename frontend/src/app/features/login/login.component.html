<div class="login-page">
  <div class="login-card">
    <h1 class="login-card__title">Hi</h1>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="field" [class.field--invalid]="email.invalid && email.touched">
        <span class="field__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M3 6.5C3 5.67157 3.67157 5 4.5 5H19.5C20.3284 5 21 5.67157 21 6.5V17.5C21 18.3284 20.3284 19 19.5 19H4.5C3.67157 19 3 18.3284 3 17.5V6.5Z"
              stroke="currentColor" stroke-width="1.5" />
            <path d="M4 6.5L12 13L20 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </span>
        <input
          id="email"
          type="email"
          class="field__input"
          placeholder="Email*"
          formControlName="email"
          autocomplete="username"
        />
      </div>
      <div class="field__error" *ngIf="email.invalid && email.touched">
        <span *ngIf="email.errors?.['required']">Email is required.</span>
        <span *ngIf="email.errors?.['email']">Enter a valid email address.</span>
      </div>

      <div class="field" [class.field--invalid]="password.invalid && password.touched">
        <span class="field__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="14.5" r="3.5" stroke="currentColor" stroke-width="1.5" />
            <path d="M10.8 12L20 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M15.5 6.5L18 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M18 4L20.5 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </span>
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          class="field__input"
          placeholder="Password*"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="field__toggle"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          <svg *ngIf="!showPassword()" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M2.5 12C2.5 12 6 5.5 12 5.5C18 5.5 21.5 12 21.5 12"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M3 3L21 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path
              d="M9.9 9.9C9.34 10.46 9 11.19 9 12C9 13.66 10.34 15 12 15C12.81 15 13.54 14.66 14.1 14.1"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path
              d="M16.5 16.2C15.2 17 13.7 17.5 12 17.5C6 17.5 2.5 12 2.5 12C3.3 10.6 4.5 9.1 6 8"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <svg *ngIf="showPassword()" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M2.5 12C2.5 12 6 5.5 12 5.5C18 5.5 21.5 12 21.5 12C21.5 12 18 18.5 12 18.5C6 18.5 2.5 12 2.5 12Z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
      </div>
      <div class="field__error" *ngIf="password.invalid && password.touched">
        <span *ngIf="password.errors?.['required']">Password is required.</span>
      </div>

      <div class="login-form__error" *ngIf="errorMessage()">
        {{ errorMessage() }}
      </div>

      <button type="submit" class="login-button" [disabled]="loading()">
        <span *ngIf="!loading()">LOGIN</span>
        <span *ngIf="loading()" class="spinner" aria-hidden="true"></span>
      </button>
    </form>
  </div>
</div>
