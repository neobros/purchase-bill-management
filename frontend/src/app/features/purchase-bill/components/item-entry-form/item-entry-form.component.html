<form class="entry-form" [formGroup]="form" (ngSubmit)="onAdd()">
  <div class="entry-form__row">
    <div class="entry-form__field entry-form__field--grow">
      <label class="entry-form__label">Item<span class="required">*</span></label>
      <app-autocomplete-input
        formControlName="item"
        [options]="itemOptions"
        placeholder="Search item"
      ></app-autocomplete-input>
    </div>

    <div class="entry-form__field">
      <label class="entry-form__label">Batch</label>
      <app-select-dropdown
        formControlName="batch"
        [options]="batchOptions"
        placeholder="Select batch"
      ></app-select-dropdown>
    </div>

    <div class="entry-form__field">
      <label class="entry-form__label">Standard Cost</label>
      <input type="number" class="entry-form__input" formControlName="standardCost" min="0" step="0.01" />
    </div>

    <div class="entry-form__field">
      <label class="entry-form__label">
        Standard Price
        <span class="badge">New</span>
      </label>
      <input type="number" class="entry-form__input" formControlName="standardPrice" min="0" step="0.01" />
    </div>

    <div class="entry-form__field">
      <label class="entry-form__label">Margin</label>
      <input type="text" class="entry-form__input entry-form__input--readonly" [value]="margin | number: '1.2-2'" readonly />
    </div>

    <div class="entry-form__field entry-form__field--sm">
      <label class="entry-form__label">Qty</label>
      <input type="number" class="entry-form__input" formControlName="qty" min="0" step="1" />
    </div>

    <div class="entry-form__field entry-form__field--sm">
      <label class="entry-form__label">Free Qty</label>
      <input type="number" class="entry-form__input" formControlName="freeQty" min="0" step="1" />
    </div>
  </div>

  <div class="entry-form__row entry-form__row--secondary">
    <div class="entry-form__field entry-form__field--sm">
      <label class="entry-form__label">Discount %</label>
      <input type="number" class="entry-form__input" formControlName="discount" min="0" max="100" step="0.01" />
    </div>

    <div class="entry-form__field">
      <label class="entry-form__label">Total Cost</label>
      <input type="text" class="entry-form__input entry-form__input--readonly" [value]="totalCost | number: '1.2-2'" readonly />
    </div>

    <div class="entry-form__field">
      <label class="entry-form__label">Total Selling</label>
      <input type="text" class="entry-form__input entry-form__input--readonly" [value]="totalSelling | number: '1.2-2'" readonly />
    </div>

    <div class="entry-form__submit-group">
      <button type="button" class="cancel-button" *ngIf="editingItem" (click)="onCancelEdit()">Cancel</button>

      <button type="submit" class="add-button" [class.add-button--update]="editingItem">
        {{ editingItem ? 'Update' : 'Add' }}
        <span class="add-button__icon">{{ editingItem ? '✓' : '+' }}</span>
      </button>
    </div>
  </div>
</form>
