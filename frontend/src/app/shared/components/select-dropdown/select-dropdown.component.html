<div class="dropdown" [class.dropdown--disabled]="disabled()">
  <button type="button" class="dropdown__trigger" (click)="toggle()">
    <span class="dropdown__value" [class.dropdown__value--placeholder]="!selectedLabel">
      {{ selectedLabel || placeholder }}
    </span>
    <svg class="dropdown__chevron" [class.dropdown__chevron--open]="isOpen()" viewBox="0 0 24 24" fill="none">
      <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <ul class="dropdown__list" *ngIf="isOpen()">
    <li *ngIf="!options.length" class="dropdown__option dropdown__option--empty">No options available</li>
    <li
      *ngFor="let option of options"
      class="dropdown__option"
      [class.dropdown__option--selected]="option.value === value()"
      (click)="selectOption(option)"
    >
      {{ option.label }}
    </li>
  </ul>
</div>
